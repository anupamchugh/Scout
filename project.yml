name: Scout
options:
  bundleIdPrefix: com.anupamchugh
  developmentLanguage: en
  deploymentTarget:
    iOS: "27.0"
    macOS: "27.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: M6P56H6G97
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
packages:
  ScoutKit:
    path: Packages/ScoutKit
  FoundationModelsUtilities:
    url: https://github.com/apple/foundation-models-utilities
    exactVersion: 1.0.0-beta5
targets:
  Scout:
    type: application
    platform: iOS
    supportedDestinations: [iOS]
    sources:
      - path: Scout
        excludes: ["Info.plist"]
    dependencies:
      - package: ScoutKit
      - package: FoundationModelsUtilities
    info:
      path: Scout/Info.plist
      properties:
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.anupamchugh.scout.pack
            UTTypeDescription: Scout role pack
            UTTypeConformsTo: [public.json]
            UTTypeTagSpecification:
              public.filename-extension: [scoutpack]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.anupamchugh.scout
        PRODUCT_NAME: Scout
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: false
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: false
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Scout
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.news
    scheme:
      testTargets:
        - ScoutTests
        - ScoutUITests
  ScoutMac:
    type: application
    platform: macOS
    sources:
      - path: Scout
        excludes: ["Info.plist", "App/ScoutApp.swift"]
      - path: ScoutMac
    dependencies:
      - package: ScoutKit
      - package: FoundationModelsUtilities
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.anupamchugh.scout
        PRODUCT_NAME: Scout
        PRODUCT_MODULE_NAME: Scout
        CODE_SIGN_ENTITLEMENTS: ScoutMac/ScoutMac.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Scout
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.news
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
  ScoutTests:
    type: bundle.unit-test
    platform: iOS
    supportedDestinations: [iOS]
    sources:
      - path: Tests
    dependencies:
      - target: Scout
      - package: ScoutKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.anupamchugh.scout.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Scout.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Scout"
        BUNDLE_LOADER: "$(TEST_HOST)"
  ScoutUITests:
    type: bundle.ui-testing
    platform: iOS
    supportedDestinations: [iOS]
    sources: [UITests]
    dependencies:
      - target: Scout
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.anupamchugh.scout.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Scout
